<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mierdiboys-Games</title>
<style>
/* Colores reutilizables del tema. Puedes ajustar estos valores para cambiar la apariencia general. */
:root{
  --bg:#f6f4ef; --fg:#1d1b18; --muted:#6b665e; --shadow:rgba(0,0,0,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#17161a; --fg:#f2efe9; --muted:#a29d94; --shadow:rgba(0,0,0,.6);}
}
:root[data-theme="dark"]{--bg:#17161a; --fg:#f2efe9; --muted:#a29d94; --shadow:rgba(0,0,0,.6);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
/* Fondo de la página: cambia wallpaper.jpg por otra imagen o ajusta la opacidad del degradado. */
body{margin:0;background-color:#17161a;background-image:linear-gradient(rgba(23, 22, 26, 0.404),rgba(23, 22, 26, 0.404)),url("wallpaper.jpg");background-position:center;background-size:cover;background-attachment:fixed;color:#f2efe9;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
/* Ancho y espaciado del encabezado; main controla por separado la cuadrícula. */
header{max-width:1100px;margin:0 auto;padding:40px 20px 8px}
h1{margin:0 0 6px;font-size:clamp(1.6rem,4vw,2.4rem);color:#ff6b6b;animation:color-cambiante 5s linear infinite}
header p{margin:0;color:#fff}
@keyframes color-cambiante{
  0%,100%{color:#ff6b6b}
  20%{color:#ffd166}
  40%{color:#06d6a0}
  60%{color:#4cc9f0}
  80%{color:#c77dff}
}
@media (prefers-reduced-motion: reduce){h1{animation:none}}
main{max-width:1100px;margin:0 auto;padding:24px 20px 56px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px}
/* Estilos de cada tarjeta y su portada. */
.card{display:block;text-decoration:none;color:inherit}
.cover{
  aspect-ratio:2/3;border-radius:12px;overflow:hidden;position:relative;
  box-shadow:0 6px 18px var(--shadow);
  transition:transform .2s ease, box-shadow .2s ease;
  display:flex;align-items:flex-end;padding:14px;
}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover span{position:relative;color:#fff;font-weight:700;font-size:1.05rem;line-height:1.2;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.cover.con-imagen::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,0) 55%)}
.cover span{z-index:1}
.card:hover .cover,.card:focus-visible .cover{transform:translateY(-6px) scale(1.03);box-shadow:0 14px 28px var(--shadow)}
.card:focus-visible{outline:none}
.card:focus-visible .cover{outline:3px solid var(--fg)}
.caption{margin-top:10px;font-size:.9rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header>
  <div style="display: flex; align-items: center; gap: 10px;">
    <!-- Cambia el enlace y la imagen para personalizar el logo del encabezado. -->

      <img src="https://b3801007.assetcdn.net/3801007/wp-content/uploads/2022/04/Biological-explanations-of-criminality.jpg?lossy=2&strip=1&webp=1" alt="Logo de Mierdiboys-Games" width="80" height="80" style="border-radius: 50%;">
    </a>
    <div>
      <h1>Mierdiboys-Games</h1>
      <p>Los juegos del enemigos su contraseña sera: elenemigos.com</p>
    </div>
  </div>
</header>
<main id="grid"></main>

  { titulo: "", url: "", img: "", ocultarTitulo: false },

];

const grid = document.getElementById("grid");
// Se descartan las entradas vacías, se ordenan alfabéticamente y se construye una tarjeta por juego.
items
  .filter(it => it.titulo)
  .sort((a, b) => a.titulo.localeCompare(b.titulo, "es", { sensitivity: "base", numeric: true }))
  .forEach(it => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = it.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.setAttribute("aria-label", it.titulo);

  const cover = document.createElement("div");
  cover.className = "cover";
  // Si hay imagen se muestra en la portada; de lo contrario se usa el degradado de colores.
  if (it.img) {
    const img = document.createElement("img");
    img.src = it.img; img.alt = it.titulo;
    cover.appendChild(img);
    cover.classList.add("con-imagen");
  } else {
    const c = it.colores || ["#555", "#222"];
    cover.style.background = `linear-gradient(160deg, ${c[0]}, ${c[1]})`;
  }
  if (!it.ocultarTitulo) {
    const s = document.createElement("span");
    s.textContent = it.titulo;
    cover.appendChild(s);
  }
  a.appendChild(cover);
  grid.appendChild(a);
});
</script>

</html>
