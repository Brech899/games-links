<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mierdiboy-Games</title>
<style>
:root{
  --bg:#f6f4ef; --fg:#1d1b18; --muted:#6b665e; --shadow:rgba(0,0,0,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#17161a; --fg:#f2efe9; --muted:#a29d94; --shadow:rgba(0,0,0,.6);}
}
:root[data-theme="dark"]{--bg:#17161a; --fg:#f2efe9; --muted:#a29d94; --shadow:rgba(0,0,0,.6);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{max-width:1100px;margin:0 auto;padding:40px 20px 8px}
h1{margin:0 0 6px;font-size:clamp(1.6rem,4vw,2.4rem)}
header p{margin:0;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:24px 20px 56px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px}
.card{display:block;text-decoration:none;color:inherit}
.cover{
  aspect-ratio:2/3;border-radius:12px;overflow:hidden;position:relative;
  box-shadow:0 6px 18px var(--shadow);
  transition:transform .2s ease, box-shadow .2s ease;
  display:flex;align-items:flex-end;padding:14px;
}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover span{position:relative;color:#fff;font-weight:700;font-size:1.05rem;line-height:1.2;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.cover.con-imagen::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,0) 55%)}
.cover span{z-index:1}
.card:hover .cover,.card:focus-visible .cover{transform:translateY(-6px) scale(1.03);box-shadow:0 14px 28px var(--shadow)}
.card:focus-visible{outline:none}
.card:focus-visible .cover{outline:3px solid var(--fg)}
.caption{margin-top:10px;font-size:.9rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header>
  <h1>Juegos</h1>
  <p>Toca para ser redirigido a la descarga.</p>
</header>
<main id="grid"></main>

<script>
// EDITA AQUÍ: título, enlace (url) y color (o imagen si la tienes incrustada)
  // { titulo: "", url: "", img: "", ocultarTitulo: true },
const items = [
  { titulo: "Among Us", url: "https://www.mediafire.com/file/sfyi6k0slbpj16n/Among+Us_v17.4i_ElEnemigos.rar/file", img: "1.jpg", ocultarTitulo: false },
  { titulo: "Ultrakill", url: "https://www.mediafire.com/file/xlk0cb0la48t39i/ULTRAKILL_b22082969_ElEnemigos.rar/file", img: "2.jpg", ocultarTitulo: false },
  { titulo: "Cuphead", url: "https://www.mediafire.com/file/xymvjgi8eti16ht/Cuphead_ElEnemigos.rar/file", img: "3.jpg", ocultarTitulo: false },
  { titulo: "Sonic Generations", url: "https://www.mediafire.com/file/f1tmhswqs73i6hf/Sonic_Generations_ElEnemigos.rar/file", img: "4.jpg" },
  { titulo: "The Binding of Isaac: Rebirth", url: "https://www.mediafire.com/file/9nc3plxtjesqxkn/The%20Binding%20of%20Isaac%20Rebirth_v1.9.7.17_ElEnemigos.rar/file", img: "5.jpg", ocultarTitulo: false },
  { titulo: "Celeste", url: "https://www.mediafire.com/file/t3ustnbpe3bgp8h/Celeste_ElEnemigos.rar/file", img: "6.png", ocultarTitulo: false },
  { titulo: "Super Meat Boy", url: "https://www.mediafire.com/file/7794gg49h9ri1iv/Super+Meat+Boy_b3241924_ElEnemigos.rar/file", img: "7.png", ocultarTitulo: false },
  { titulo: "", url: "", img: "", ocultarTitulo: true },
  { titulo: "", url: "", img: "", ocultarTitulo: true },
  { titulo: "", url: "", img: "", ocultarTitulo: true },
  { titulo: "", url: "", img: "", ocultarTitulo: true },
  { titulo: "", url: "", img: "", ocultarTitulo: true },
  { titulo: "", url: "", img: "", ocultarTitulo: true },
  { titulo: "", url: "", img: "", ocultarTitulo: true },
  { titulo: "", url: "", img: "", ocultarTitulo: true },
  { titulo: "", url: "", img: "", ocultarTitulo: true },
  { titulo: "", url: "", img: "", ocultarTitulo: true },
];

const grid = document.getElementById("grid");
items
  .filter(it => it.titulo)
  .sort((a, b) => a.titulo.localeCompare(b.titulo, "es", { sensitivity: "base", numeric: true }))
  .forEach(it => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = it.url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.setAttribute("aria-label", it.titulo);

  const cover = document.createElement("div");
  cover.className = "cover";
  if (it.img) {
    const img = document.createElement("img");
    img.src = it.img; img.alt = it.titulo;
    cover.appendChild(img);
    cover.classList.add("con-imagen");
  } else {
    const c = it.colores || ["#555", "#222"];
    cover.style.background = `linear-gradient(160deg, ${c[0]}, ${c[1]})`;
  }
  if (!it.ocultarTitulo) {
    const s = document.createElement("span");
    s.textContent = it.titulo;
    cover.appendChild(s);
  }
  a.appendChild(cover);
  grid.appendChild(a);
});
</script>
</body>
</html>
